name: Security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required only for private repositories under a GitHub organization.
          # Personal accounts and public repos run gitleaks-action for free without it.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  client-service-role:
    name: No service_role in client code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check app/ and components/ for service_role leaks
        run: node scripts/security/check-client-service-role.mjs

  rls-baseline:
    name: RLS baseline check (warning-only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check supabase/migrations for tables without RLS
        run: node scripts/security/check-rls.mjs
